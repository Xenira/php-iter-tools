name: Push

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
        env:
          debug: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Setup LLVM & Clang
        id: clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 17
          directory: ${{ runner.temp }}/llvm-17
      - name: Configure Clang
        if: "!contains(matrix.os, 'windows')"
        run: |
          echo "LIBCLANG_PATH=${{ runner.temp }}/llvm-17/lib" >> $GITHUB_ENV
          echo "LLVM_VERSION=${{ steps.clang.outputs.version }}" >> $GITHUB_ENV
          echo "LLVM_CONFIG_PATH=${{ runner.temp }}/llvm-17/bin/llvm-config" >> $GITHUB_ENV
      - name: Build
        run: cargo build --locked -v
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: libext_itertools_debug
          path: target/debug/libext_itertools*

  # test:
