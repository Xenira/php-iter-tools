[package]
name = "php_iter_tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.78.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.82"
dyn-clone = "1.0.17"
ext-php-rs = { path = "../../ext-php-rs/", features = ["anyhow"] }

[profile.release]
strip = "debuginfo"
lto=true
